<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ec" />
    <!--
      Theme pre-paint. Runs synchronously before React mounts so a user who
      chose dark in localStorage doesn't see a flash of light theme during
      hydration. Three states: 'light' / 'dark' / null (= follow system).
      When null, the CSS @media (prefers-color-scheme: dark) block applies.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mosaic-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) { /* localStorage blocked — fall back to system */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" />
    <!--
      Per-route <title>, <meta name="description">, <link rel="canonical">,
      OG/Twitter tags, and JSON-LD are rendered by src/lib/seo.tsx and hoisted
      to <head> by React 19. We deliberately do NOT emit static fallbacks
      here: React 19 hoists alongside static tags (it does not replace them),
      so a static <title> would produce two <title> elements and a static
      description would trip Google's "duplicate meta description" warning.
      No-JS crawlers currently see no <title>/description — fixed when
      build-time prerender lands (docs/improvement-roadmap.md P1 #9).
    -->
    <!--
      Cloudflare Turnstile, explicit render mode. The contact form is a lazily
      mounted route, so the widget element is inserted into the DOM after this
      script loads. Implicit auto-scan only runs once on script load and would
      never see it — explicit mode lets Contact.tsx call turnstile.render() when
      the route mounts. See src/routes/Contact.tsx.
    -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
