name: Deploy to GitHub Pages

# This workflow builds and publishes a static mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages mode)
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://mosaicbyte.design
        run: npm run build

      - name: SPA fallback for client-side routing
        # Wouter does client-side history-API routing (/, /work, /about,
        # /contact, /privacy). GitHub Pages has no server-side rewrite rule,
        # so a direct hit or refresh on any non-root path 404s. GitHub Pages
        # serves 404.html for any unmatched path; since it's the same SPA
        # shell as index.html, Wouter's client-side router then renders the
        # correct route from the URL.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
