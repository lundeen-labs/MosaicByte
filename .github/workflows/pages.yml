name: Deploy to GitHub Pages

# This workflow builds and publishes a static mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages mode)
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://mosaicbyte.design
        run: npm run build

      - name: Verify prerendered output
        # scripts/prerender.mjs writes dist/<route>/index.html for every real
        # route AND a dist/404.html prerendered from the NotFound route, so
        # GitHub Pages serves real markup for a direct hit on any path and a
        # genuine 404 page (not a copy of the homepage) for an unmatched one.
        # Both are still full SPA shells, so Wouter hydrates and takes over.
        # This step fails the build if the prerender silently produced nothing.
        run: |
          set -euo pipefail
          required="index.html 404.html work/index.html about/index.html contact/index.html privacy/index.html sitemap.xml robots.txt CNAME"
          for f in $required; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::missing or empty dist/$f"
              exit 1
            fi
          done
          if ! grep -q '<h1' dist/index.html; then
            echo "::error::dist/index.html has no <h1> - prerender did not run"
            exit 1
          fi
          if ! grep -q '404' dist/404.html; then
            echo "::error::dist/404.html is not the prerendered NotFound page"
            exit 1
          fi
          echo "prerendered output verified"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
